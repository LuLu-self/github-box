name: github-box-install

# Reusable workflow: the library calls it pinned by commit SHA whenever state.json changes.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}

      - name: Locate pipeline scripts
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          [ -n "$WF_REPO" ] && [ -n "$WF_SHA" ] || { echo "::error::job.workflow_repository/sha empty"; exit 1; }
          echo "BOX=$RUNNER_TEMP/github-box" >> "$GITHUB_ENV"

      # Scripts are checked out inside the worktree, then moved out so they can never be committed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github-box-install
          sparse-checkout: |
            action
            skill
          persist-credentials: false

      - name: Move scripts out of the worktree
        run: mv "$GITHUB_WORKSPACE/.github-box-install" "$BOX"

      # Used only to re-check each bundle with the real `claude plugin install`; nothing is run.
      - name: Install Claude Code for verification
        run: npm install -g "@anthropic-ai/claude-code@2.1.310" && claude --version

      - name: Build marketplace and skill zips
        env:
          WF_REPO: ${{ job.workflow_repository }}
          LIBRARY: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner="${WF_REPO%%/*}"; name="${WF_REPO#*/}"
          pages="https://${owner,,}.github.io/${name}/"
          python3 "$BOX/action/scripts/install.py" --repo "$GITHUB_WORKSPACE" --library-name "$LIBRARY" \
            --pages "$pages" --skill-src "$BOX/skill/github-box" --verify --push | tee "$RUNNER_TEMP/install.json"
          jq -r '"## install\n- installed: \(.installed)\n" + (.problems | map("- " + .) | join("\n"))' "$RUNNER_TEMP/install.json" >> "$GITHUB_STEP_SUMMARY"
